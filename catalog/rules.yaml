version: "2026.10.0"
judgment: >
  The links below are my judgment of which technical check supports which
  control. They are not certified, and a passing check is not a compliance
  claim. Short titles elsewhere in this repo are my own glosses. No text
  from ISO/IEC 27001, BSI C5 or DORA is copied here.
c5_criteria_total: 121
c5_criteria_total_source: "https://www.bsi.bund.de/EN/Themen/Unternehmen-und-Organisationen/Informationen-und-Empfehlungen/Empfehlungen-nach-Angriffszielen/Cloud-Computing/Kriterienkatalog-C5/C5_Einfuehrung/C5_Einfuehrung.html"
c5_gloss:
  AM-01: "Knowing which assets you have"
  AM-06: "Classifying assets and making that visible"
  COS-01: "Technical safeguards on the network"
  COS-02: "Security requirements for connections"
  COS-05: "Administration traffic kept apart"
  COS-08: "Rules for transmitting data"
  CRY-02: "Encrypting data while it moves"
  CRY-04: "Keys that cannot be quietly destroyed"
  IDM-06: "Privileged access"
  IDM-07: "Access to customer data"
  IDM-09: "How users and apps authenticate"
  OPS-06: "Backup and recovery concept"
  OPS-10: "What gets logged"
  OPS-14: "Keeping the logs"
  PSS-12: "Where data is processed and stored"
grundschutz_gloss:
  APP.3.1: "Web applications"
  CON.1: "Cryptographic concept"
  CON.3: "Backup concept"
  DER.1: "Detecting security events"
  NET.1.1: "Network architecture"
  NET.3.2: "Firewall"
  OPS.1.1.2: "Orderly IT administration"
  OPS.1.1.5: "Logging"
  OPS.2.2: "Using cloud services"
  ORP.4: "Identity and access"
dora_tracked:
  - id: Art.5
    topic: "The management body stays responsible for ICT risk"
  - id: Art.6
    topic: "The ICT risk-management framework"
  - id: Art.8
    topic: "Identify the ICT assets and dependencies that matter"
  - id: Art.9
    topic: "Protect systems and prevent incidents"
  - id: Art.10
    topic: "Detect anomalous activity"
  - id: Art.11
    topic: "Respond and recover"
  - id: Art.12
    topic: "Back up and restore"
  - id: Art.13
    topic: "Learn from incidents and adjust"
nis2:
  tag: BSIG-30
  note: >
    NordPay is framed as a payment institution, so this demo treats DORA as
    the regime in scope. NIS2's own risk-management measures are largely
    displaced for financial entities that DORA already covers; that is the
    lex-specialis idea in NIS2 Article 4, and the German implementation sits
    in the BSIG after the NIS2 implementation act. I have not had a lawyer
    confirm the exact wording of that displacement. BSIG-30 is therefore a
    crosswalk tag on technical checks, not a second obligation and not a
    coverage percentage.

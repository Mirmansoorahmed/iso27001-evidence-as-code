<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">NordPay evidence pipeline</title>
  <desc id="desc">Offline path from the Terraform landing zone through Checkov and OPA to a hashed auditor pack and a static dashboard. GitHub Actions runs the same path.</desc>
  <rect width="1200" height="640" fill="#f6f4ef"/>
  <text x="36" y="42" font-family="Georgia, 'Iowan Old Style', serif" font-size="26" fill="#1c2430">From a Terraform change to an auditor pack</text>
  <text x="36" y="68" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5c6570">NordPay GmbH is fictional. This path never calls a cloud API.</text>

  <rect x="36" y="88" width="1128" height="52" rx="8" fill="#ffffff" stroke="#d9d3c7"/>
  <g transform="translate(52.00 100.00) scale(1.1667)"><path d="M10.984 13.836a.5.5 0 0 1-.353-.146l-.745-.743a.5.5 0 1 1 .706-.708l.392.391 1.181-1.18a.5.5 0 0 1 .708.707l-1.535 1.533a.504.504 0 0 1-.354.146zm9.353-.147l1.534-1.532a.5.5 0 0 0-.707-.707l-1.181 1.18-.392-.391a.5.5 0 1 0-.706.708l.746.743a.497.497 0 0 0 .706-.001zM4.527 7.452l2.557-1.585A1 1 0 0 0 7.09 4.17L4.533 2.56A1 1 0 0 0 3 3.406v3.196a1.001 1.001 0 0 0 1.527.85zm2.03-2.436L4 6.602V3.406l2.557 1.61zM24 12.5c0 1.93-1.57 3.5-3.5 3.5a3.503 3.503 0 0 1-3.46-3h-2.08a3.503 3.503 0 0 1-3.46 3 3.502 3.502 0 0 1-3.46-3h-.558c-.972 0-1.85-.399-2.482-1.042V17c0 1.654 1.346 3 3 3h.04c.244-1.693 1.7-3 3.46-3 1.93 0 3.5 1.57 3.5 3.5S13.43 24 11.5 24a3.502 3.502 0 0 1-3.46-3H8c-2.206 0-4-1.794-4-4V9.899A5.008 5.008 0 0 1 0 5c0-2.757 2.243-5 5-5s5 2.243 5 5a5.005 5.005 0 0 1-4.952 4.998A2.482 2.482 0 0 0 7.482 12h.558c.244-1.693 1.7-3 3.46-3a3.502 3.502 0 0 1 3.46 3h2.08a3.503 3.503 0 0 1 3.46-3c1.93 0 3.5 1.57 3.5 3.5zm-15 8c0 1.378 1.122 2.5 2.5 2.5s2.5-1.122 2.5-2.5-1.122-2.5-2.5-2.5S9 19.122 9 20.5zM5 9c2.206 0 4-1.794 4-4S7.206 1 5 1 1 2.794 1 5s1.794 4 4 4zm9 3.5c0-1.378-1.122-2.5-2.5-2.5S9 11.122 9 12.5s1.122 2.5 2.5 2.5 2.5-1.122 2.5-2.5zm9 0c0-1.378-1.122-2.5-2.5-2.5S18 11.122 18 12.5s1.122 2.5 2.5 2.5 2.5-1.122 2.5-2.5zm-13 8a.5.5 0 1 0 1 0 .5.5 0 0 0-1 0zm2 0a.5.5 0 1 0 1 0 .5.5 0 0 0-1 0zm12 0c0 1.93-1.57 3.5-3.5 3.5a3.503 3.503 0 0 1-3.46-3.002c-.007.001-.013.005-.021.005l-.506.017h-.017a.5.5 0 0 1-.016-.999l.506-.017c.018-.002.035.006.052.007A3.503 3.503 0 0 1 20.5 17c1.93 0 3.5 1.57 3.5 3.5zm-1 0c0-1.378-1.122-2.5-2.5-2.5S18 19.122 18 20.5s1.122 2.5 2.5 2.5 2.5-1.122 2.5-2.5z" fill="#2088FF"/></g>
  <text x="92" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#1c2430">GitHub Actions</text>
  <text x="230" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5c6570">runs the same pipeline on each pull request and every night</text>
<path d="M292 368 h24" stroke="#8a8175" stroke-width="1.5" fill="none"/><path d="M310 363 l8 5 l-8 5" fill="#8a8175"/><path d="M586 368 h24" stroke="#8a8175" stroke-width="1.5" fill="none"/><path d="M604 363 l8 5 l-8 5" fill="#8a8175"/><path d="M880 368 h24" stroke="#8a8175" stroke-width="1.5" fill="none"/><path d="M898 363 l8 5 l-8 5" fill="#8a8175"/>
  <rect x="36" y="168" width="246" height="400" rx="10" fill="#ffffff" stroke="#d9d3c7"/>
  <g transform="translate(52.00 186.00) scale(1.3333)"><path d="M1.44 0v7.575l6.561 3.79V3.787zm21.12 4.227l-6.561 3.791v7.574l6.56-3.787zM8.72 4.23v7.575l6.561 3.787V8.018zm0 8.405v7.575L15.28 24v-7.578z" fill="#844FBA"/></g>
  <text x="94" y="208" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#1c2430">Terraform</text>
  <text x="54" y="248" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1c2430">Landing zone in lz/</text>
  <text x="54" y="270" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">Germany West Central, literals</text>
  <text x="54" y="292" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">so the policies can read them.</text>
  <text x="54" y="328" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1c2430">Labelled fixtures</text>
  <text x="54" y="350" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">22 misconfigurations, one</text>
  <text x="54" y="372" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">negative control, a drift pair,</text>
  <text x="54" y="394" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">and a sample pull request.</text>
  <line x1="54" y1="430" x2="264" y2="430" stroke="#efeae2"/>
  <g transform="translate(52.00 448.00) scale(1.1667)"><path d="M22.379 23.343a1.62 1.62 0 0 0 1.536-2.14v.002L17.35 1.76A1.62 1.62 0 0 0 15.816.657H8.184A1.62 1.62 0 0 0 6.65 1.76L.086 21.204a1.62 1.62 0 0 0 1.536 2.139h4.741a1.62 1.62 0 0 0 1.535-1.103l.977-2.892 4.947 3.675c.28.208.618.32.966.32m-3.084-12.531 3.624 10.739a.54.54 0 0 1-.51.713v-.001h-.03a.54.54 0 0 1-.322-.106l-9.287-6.9h4.853m6.313 7.006c.116-.326.13-.694.007-1.058L9.79 1.76a1.722 1.722 0 0 0-.007-.02h6.034a.54.54 0 0 1 .512.366l6.562 19.445a.54.54 0 0 1-.338.684" fill="#0078D4"/></g>
  <text x="90" y="466" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#1c2430">Azure</text>
  <text x="54" y="492" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">The shape of the account.</text>
  <text x="54" y="514" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">No subscription, no credentials.</text>


  <rect x="330" y="168" width="246" height="400" rx="10" fill="#ffffff" stroke="#d9d3c7"/>
  <text x="348" y="208" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#1c2430">Checkov</text>
  <text x="348" y="232" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">Adopted Azure checks on the</text>
  <text x="348" y="254" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">HCL. Passes are kept; a quiet</text>
  <text x="348" y="276" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">scan would hide them.</text>
  <line x1="348" y1="304" x2="558" y2="304" stroke="#efeae2"/>
  <g transform="translate(348.00 322.00) scale(0.6429)"><path d="M52.5 16.917c0-4.667-8.75-15.167-9.333-15.75 2.098 9.444 1.837 8.034 2.188 11.05.093.795.132 1.62-.186 2.355-1.457 3.365-6.67 5.26-6.67 5.26l8.166 7S52.5 21 52.5 16.918zm-49 0c0-4.667 8.75-15.167 9.333-15.75-2.098 9.444-1.838 8.034-2.188 11.05-.093.795-.132 1.62.186 2.355 1.457 3.365 6.67 5.26 6.67 5.26l-8.166 7S3.5 21 3.5 16.918z" fill="#BFBFBF"/><path d="M28 12.25c9.144 0 15.784 6.427 18.667 14.583v14s-5.834 2.334-9.334 4.667c-3.5 2.333-8.75 9.333-8.75 9.333H28V12.25z" fill="#566366"/><path d="M28 12.25c-9.144 0-15.784 6.427-18.667 14.583v14s5.834 2.334 9.334 4.667c3.5 2.333 8.75 9.333 8.75 9.333H28V12.25z" fill="#7D9199"/><circle cx="28" cy="26.833" r="2.333" fill="#fff"/></g>
  <text x="394" y="346" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#1c2430">Open Policy Agent</text>
  <text x="348" y="390" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">Conftest runs the Rego in</text>
  <text x="348" y="412" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">policies/: tags, EU region,</text>
  <text x="348" y="434" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">purge protection, RBAC,</text>
  <text x="348" y="456" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">diagnostics, backup, logs.</text>
  <text x="348" y="492" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">Unresolved variables fail closed.</text>
  <text x="348" y="514" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">One local.* hop is resolved.</text>


  <rect x="624" y="168" width="246" height="400" rx="10" fill="#ffffff" stroke="#d9d3c7"/>
  <g transform="translate(640.00 186.00) scale(1.3333)"><path d="M14.25.18l.9.2.73.26.59.3.45.32.34.34.25.34.16.33.1.3.04.26.02.2-.01.13V8.5l-.05.63-.13.55-.21.46-.26.38-.3.31-.33.25-.35.19-.35.14-.33.1-.3.07-.26.04-.21.02H8.77l-.69.05-.59.14-.5.22-.41.27-.33.32-.27.35-.2.36-.15.37-.1.35-.07.32-.04.27-.02.21v3.06H3.17l-.21-.03-.28-.07-.32-.12-.35-.18-.36-.26-.36-.36-.35-.46-.32-.59-.28-.73-.21-.88-.14-1.05-.05-1.23.06-1.22.16-1.04.24-.87.32-.71.36-.57.4-.44.42-.33.42-.24.4-.16.36-.1.32-.05.24-.01h.16l.06.01h8.16v-.83H6.18l-.01-2.75-.02-.37.05-.34.11-.31.17-.28.25-.26.31-.23.38-.2.44-.18.51-.15.58-.12.64-.1.71-.06.77-.04.84-.02 1.27.05zm-6.3 1.98l-.23.33-.08.41.08.41.23.34.33.22.41.09.41-.09.33-.22.23-.34.08-.41-.08-.41-.23-.33-.33-.22-.41-.09-.41.09zm13.09 3.95l.28.06.32.12.35.18.36.27.36.35.35.47.32.59.28.73.21.88.14 1.04.05 1.23-.06 1.23-.16 1.04-.24.86-.32.71-.36.57-.4.45-.42.33-.42.24-.4.16-.36.09-.32.05-.24.02-.16-.01h-8.22v.82h5.84l.01 2.76.02.36-.05.34-.11.31-.17.29-.25.25-.31.24-.38.2-.44.17-.51.15-.58.13-.64.09-.71.07-.77.04-.84.01-1.27-.04-1.07-.14-.9-.2-.73-.25-.59-.3-.45-.33-.34-.34-.25-.34-.16-.33-.1-.3-.04-.25-.02-.2.01-.13v-5.34l.05-.64.13-.54.21-.46.26-.38.3-.32.33-.24.35-.2.35-.14.33-.1.3-.06.26-.04.21-.02.13-.01h5.84l.69-.05.59-.14.5-.21.41-.28.33-.32.27-.35.2-.36.15-.36.1-.35.07-.32.04-.28.02-.21V6.07h2.09l.14.01zm-6.47 14.25l-.23.33-.08.41.08.41.23.33.33.23.41.08.41-.08.33-.23.23-.33.08-.41-.08-.41-.23-.33-.33-.23-.41-.08-.41.08z" fill="#3776AB"/></g>
  <text x="682" y="208" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#1c2430">Python collector</text>
  <text x="642" y="252" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1c2430">Normalised evidence</text>
  <text x="642" y="274" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">Pydantic records. The sha256 is</text>
  <text x="642" y="296" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">of the scanner slice, not of a</text>
  <text x="642" y="318" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">story written afterwards.</text>
  <text x="642" y="354" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1c2430">Hash chain</text>
  <text x="642" y="376" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">Each record names the previous</text>
  <text x="642" y="398" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">manifest. Genesis has an empty</text>
  <text x="642" y="420" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">previous hash. The next pack</text>
  <text x="642" y="442" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">embeds that manifest.</text>
  <text x="642" y="478" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1c2430">Catalogue</text>
  <text x="642" y="500" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">Annex A, C5, Grundschutz,</text>
  <text x="642" y="522" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">DORA, and a BSIG-30 tag.</text>


  <rect x="918" y="168" width="246" height="400" rx="10" fill="#ffffff" stroke="#d9d3c7"/>
  <text x="936" y="208" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#1c2430">Statement of applicability</text>
  <text x="936" y="236" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">All 93 Annex A controls.</text>
  <text x="936" y="258" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">A clean automated check is</text>
  <text x="936" y="280" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">partial: the control is wider</text>
  <text x="936" y="302" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">than the rule.</text>
  <text x="936" y="338" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1c2430">Auditor pack</text>
  <text x="936" y="360" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">Tarball, MANIFEST.json,</text>
  <text x="936" y="382" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">MANIFEST.sha256, verify.sh.</text>
  <text x="936" y="404" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">The script uses sha256sum</text>
  <text x="936" y="426" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">and jq only.</text>
  <text x="936" y="462" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1c2430">Dashboard</text>
  <text x="936" y="484" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">Static HTML and Markdown.</text>
  <text x="936" y="506" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c6570">No live data behind it.</text>

  <text x="36" y="608" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8a8175">Marks: Terraform, Azure, GitHub Actions, Python, Open Policy Agent. Attribution in docs/icons/SOURCES.md. Trademarks stay with their owners.</text>
</svg>

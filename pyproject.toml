[project]
name = "eac"
version = "0.1.0"
description = "Offline evidence-as-code pipeline for a fictional Azure landing zone."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Jinja2>=3.1",
  "pydantic>=2.6",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
eac = "eac.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eac*"]

[tool.setuptools.package-data]
eac = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
